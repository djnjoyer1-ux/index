<html lang="en">

<title>Arcana Frontier: Runehold</title>
<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020306;color:var(--ink);font-family:Georgia,serif}

#quest{position:absolute;right:18px;top:205px;width:245px}.questTitle{color:var(--gold);font-size:17px;margin-bottom:8px}.questLine{padding:5px 0;border-top:1px solid #423b2b}.questLine:first-of-type{border:0}.done{color:#7cc78b}

@media(max-width:800px){.classes{grid-template-columns:1fr 1fr}#playerPanel{width:230px}#statsPanel{display:none}#minimap,#quest{transform:scale(.78);transform-origin:top right}.slot{width:95px;height:72px;font-size:11px}.icon{font-size:22px}.slot b{font-size:12px}}
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<div id="hud">
 <div id="playerPanel" class="panel"><div class="name" id="name"></div><div class="bar"><i id="hpFill" class="hp"></i><span id="hpText"></span></div><div class="bar"><i id="mpFill" class="mp"></i><span id="mpText"></span></div><div class="bar"><i id="xpFill" class="xp"></i><span id="xpText"></span></div></div>
 <div id="statsPanel" class="panel"></div><canvas id="minimap" width="245" height="175"></canvas>
 <div id="quest" class="panel"><div class="questTitle">ACTIVE QUESTS</div><div class="questLine" id="q1">◇ Find the Arcane Key <span style="float:right">0 / 1</span></div><div class="questLine" id="q2">◇ Cleanse Runehold <span style="float:right" id="enemyCount"></span></div><div class="questLine" id="q3">◇ Reach the Moon Gate</div></div>
 <div id="message"></div><div id="interact"></div><div id="crosshair">+</div><div id="spellbar"></div>
</div>
<div id="start" class="overlay"><div class="card"><h1 class="logo">ARCANA FRONTIER</h1><div class="subtitle">RUNEHOLD — a first-person pixel-fantasy roguelike</div><div class="classes" id="classes"></div><div class="controls"><span class="key">WASD</span> move · <span class="key">Mouse</span> look · <span class="key">Click</span> cast · <span class="key">1–4</span> spells · <span class="key">E</span> interact · <span class="key">Shift</span> sprint · <span class="key">M</span> map</div></div></div>
<div id="dead" class="overlay end"><div class="card"><h2>YOU FELL</h2><p id="deadText"></p><button onclick="location.reload()">Begin a New Run</button></div></div>
<div id="win" class="overlay end"><div class="card"><h2>RUNEHOLD CLEANSED</h2><p id="winText"></p><button onclick="location.reload()">Enter Another Realm</button></div></div>
<script>
'use strict';
const C=document.querySelector('#game'),X=C.getContext('2d'),W=C.width,H=C.height,FOV=Math.PI/3,MW=44,MH=44;
X.imageSmoothingEnabled=false;
const MM=document.querySelector('#minimap'),MX=MM.getContext('2d');
let map=[],rooms=[],enemies=[],drops=[],shots=[],fx=[],torches=[],gate={x:0,y:0},keyItem={x:0,y:0,taken:false};
let running=false,last=0,showMap=true,msgT=0,hitFlash=0,castFlash=0,shake=0,seed=(Math.random()*1e9)|0;
const keys={},depth=new Float32Array(W),zSprite=[];
const classData={
 Battlemage:{icon:'✦',hp:120,mp:90,speed:2.65,armor:.16,regen:5,crit:.08,spells:['Firebolt','Frost Nova','Ward','Blink'],desc:'A durable spellblade with elemental control.'},
 Arcanist:{icon:'☿',hp:82,mp:150,speed:2.5,armor:.04,regen:9,crit:.14,spells:['Arc Lance','Chain Spark','Meteor','Blink'],desc:'A fragile master of overwhelming arcane power.'},
 Warden:{icon:'♜',hp:150,mp:72,speed:2.3,armor:.24,regen:4,crit:.05,spells:['Stone Shard','Thorn Ring','Ward','Earthquake'],desc:'An armored guardian who controls the battlefield.'},
 Nightweaver:{icon:'☾',hp:94,mp:108,speed:3.05,armor:.08,regen:6,crit:.23,spells:['Shadow Dart','Soul Drain','Vanish','Blink'],desc:'A swift shadow caster built around precision.'}
};
const spell={
 'Firebolt':{icon:'🔥',cost:10,cd:.28,dmg:24,type:'bolt',color:[255,105,35],speed:8},'Frost Nova':{icon:'❄',cost:22,cd:2.5,dmg:17,type:'nova',color:[100,205,255]},'Ward':{icon:'✥',cost:26,cd:6,dmg:0,type:'ward',color:[120,255,150]},'Blink':{icon:'◆',cost:18,cd:2.2,dmg:0,type:'blink',color:[180,95,255]},
 'Arc Lance':{icon:'⚡',cost:13,cd:.34,dmg:32,type:'bolt',color:[175,105,255],speed:10},'Chain Spark':{icon:'ϟ',cost:25,cd:2,dmg:23,type:'chain',color:[80,220,255]},'Meteor':{icon:'☄',cost:44,cd:5.5,dmg:72,type:'meteor',color:[255,70,25]},
 'Stone Shard':{icon:'◆',cost:9,cd:.4,dmg:21,type:'bolt',color:[215,178,125],speed:7},'Thorn Ring':{icon:'✣',cost:21,cd:2.7,dmg:20,type:'nova',color:[100,210,95]},'Earthquake':{icon:'〽',cost:38,cd:5,dmg:47,type:'quake',color:[205,145,70]},
 'Shadow Dart':{icon:'◈',cost:8,cd:.22,dmg:19,type:'bolt',color:[205,80,255],speed:11},'Soul Drain':{icon:'♥',cost:18,cd:1.3,dmg:25,type:'drain',color:[255,70,135]},'Vanish':{icon:'◌',cost:25,cd:6,dmg:0,type:'vanish',color:[100,85,190]}
};
let p={x:2.5,y:2.5,a:0,bob:0,hp:100,maxHp:100,mp:100,maxMp:100,speed:2.5,armor:0,regen:5,crit:.1,level:1,xp:0,next:100,kills:0,gold:0,cls:'',spells:[],sel:0,cd:[0,0,0,0],ward:0,vanish:0,key:false};
const rnd=(a=1,b=0)=>{seed=(seed*1664525+1013904223)|0;let r=((seed>>>0)/4294967296);return b+(a-b)*r},ri=(a,b)=>Math.floor(rnd(b,a));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),adiff=(a,b)=>{let d=(a-b+Math.PI)%(Math.PI*2)-Math.PI;return d<-Math.PI?d+Math.PI*2:d};
function solid(x,y){let ix=x|0,iy=y|0;return ix<0||iy<0||ix>=MW||iy>=MH||map[iy][ix]>0}
function carve(x1,y1,x2,y2){let x=x1,y=y1;while(x!==x2||y!==y2){map[y][x]=0;if(x!==x2)x+=Math.sign(x2-x);else y+=Math.sign(y2-y)}map[y][x]=0}
function generate(){map=Array.from({length:MH},()=>Array(MW).fill(1));rooms=[];for(let i=0;i<90&&rooms.length<20;i++){let w=ri(5,10),h=ri(5,10),x=ri(2,MW-w-2),y=ri(2,MH-h-2);if(rooms.some(r=>x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y))continue;for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)map[yy][xx]=0;if(rooms.length){let a=rooms.at(-1),ax=(a.x+a.w/2)|0,ay=(a.y+a.h/2)|0,bx=(x+w/2)|0,by=(y+h/2)|0;if(rnd()<.5){carve(ax,ay,bx,ay);carve(bx,ay,bx,by)}else{carve(ax,ay,ax,by);carve(ax,by,bx,by)}}rooms.push({x,y,w,h})}
 let s=rooms[0],g=rooms.at(-1),k=rooms[(rooms.length*.55)|0];p.x=s.x+s.w/2;p.y=s.y+s.h/2;p.a=0;gate={x:g.x+g.w/2,y:g.y+g.h/2};keyItem={x:k.x+k.w/2,y:k.y+k.h/2,taken:false};
 enemies=[];drops=[];torches=[];shots=[];fx=[];for(let [i,r] of rooms.entries()){if(i>1&&i<rooms.length-1){let n=ri(1,Math.min(4,1+i/5));for(let j=0;j<n;j++)enemies.push(makeEnemy(r.x+rnd(r.w-2,1),r.y+rnd(r.h-2,1),i));if(rnd()<.65)drops.push({x:r.x+rnd(r.w-2,1),y:r.y+rnd(r.h-2,1),kind:rnd()<.55?'health':rnd()<.7?'mana':'chest',taken:false})}if(i%2===0)torches.push({x:r.x+.35,y:r.y+r.h/2,phase:rnd(Math.PI*2)})}
 }
function makeEnemy(x,y,tier){let r=rnd(),type=r<.45?'goblin':r<.72?'skeleton':r<.9?'wraith':'ogre',d={goblin:[46,9,1.4],skeleton:[38,11,1.25],wraith:[34,13,1.7],ogre:[90,18,.82]}[type],m=1+tier*.025;return{x,y,type,hp:d[0]*m,maxHp:d[0]*m,dmg:d[1]*m,speed:d[2],attack:0,hit:0,slow:0,dead:false,anim:rnd(Math.PI*2)}}
function chooseClass(n){let c=classData[n];Object.assign(p,{cls:n,hp:c.hp,maxHp:c.hp,mp:c.mp,maxMp:c.mp,speed:c.speed,armor:c.armor,regen:c.regen,crit:c.crit,spells:[...c.spells]});document.querySelector('#start').style.display='none';running=true;C.requestPointerLock?.();buildSpells();say('Recover the Arcane Key and cleanse Runehold.')}
function setup(){let box=document.querySelector('#classes');for(let [n,c] of Object.entries(classData)){let b=document.createElement('button');b.className='class';b.innerHTML=`<div class="sigil">${c.icon}</div><h3>${n}</h3><p>${c.desc}</p>`;b.onclick=()=>chooseClass(n);box.appendChild(b)}generate();requestAnimationFrame(loop)}
function buildSpells(){let b=document.querySelector('#spellbar');b.innerHTML='';p.spells.forEach((n,i)=>{let s=spell[n],d=document.createElement('div');d.className='slot'+(i===p.sel?' active':'');d.id='slot'+i;d.innerHTML=`<div class="icon">${s.icon}</div><b>${i+1}. ${n}</b><small>${s.cost} mana</small>`;b.appendChild(d)})}
function move(dx,dy){let r=.22;if(!solid(p.x+dx+Math.sign(dx)*r,p.y))p.x+=dx;if(!solid(p.x,p.y+dy+Math.sign(dy)*r))p.y+=dy}
function update(dt){if(!running)return;let f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),turn=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);p.a+=turn*2.1*dt;let moving=f||s,spd=p.speed*(keys.ShiftLeft?1.45:1);move((Math.cos(p.a)*f+Math.cos(p.a+Math.PI/2)*s)*spd*dt,(Math.sin(p.a)*f+Math.sin(p.a+Math.PI/2)*s)*spd*dt);if(moving)p.bob+=dt*spd*5;
 p.mp=Math.min(p.maxMp,p.mp+p.regen*dt);p.ward=Math.max(0,p.ward-dt);p.vanish=Math.max(0,p.vanish-dt);p.cd=p.cd.map(x=>Math.max(0,x-dt));msgT-=dt;hitFlash=Math.max(0,hitFlash-dt*3);castFlash=Math.max(0,castFlash-dt*4);shake=Math.max(0,shake-dt*9);if(msgT<=0)document.querySelector('#message').textContent='';
 for(let q of shots){q.life-=dt;q.x+=Math.cos(q.a)*q.speed*dt;q.y+=Math.sin(q.a)*q.speed*dt;trail(q.x,q.y,q.color);if(solid(q.x,q.y))q.life=0;for(let e of enemies)if(!e.dead&&Math.hypot(e.x-q.x,e.y-q.y)<.38){damageEnemy(e,q.dmg);q.life=0;break}}shots=shots.filter(q=>q.life>0);
 for(let e of enemies){if(e.dead)continue;e.anim+=dt*4;e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,e.slow-dt);e.attack-=dt;let d=dist(p,e);if(d<9&&p.vanish<=0){if(d>.72){let a=Math.atan2(p.y-e.y,p.x-e.x),sp=e.speed*(e.slow?.45:1),nx=e.x+Math.cos(a)*sp*dt,ny=e.y+Math.sin(a)*sp*dt;if(!solid(nx,ny)&&enemies.every(o=>o===e||o.dead||Math.hypot(o.x-nx,o.y-ny)>.4)){e.x=nx;e.y=ny}}else if(e.attack<=0){p.hp-=e.dmg*(1-p.armor)*(p.ward?.35:1);e.attack=1.05;hitFlash=1;shake=.7;if(p.hp<=0)die()}}}
 for(let d of drops)if(!d.taken&&dist(p,d)<.55){d.taken=true;if(d.kind==='health'){p.hp=Math.min(p.maxHp,p.hp+45);say('Vitality restored.')}else if(d.kind==='mana'){p.mp=Math.min(p.maxMp,p.mp+55);say('Mana restored.')}else{p.gold+=ri(12,35);let r=ri(0,4);if(r===0){p.maxHp+=12;p.hp+=12;say('Relic: +12 maximum health.')}if(r===1){p.maxMp+=14;p.mp+=14;say('Relic: +14 maximum mana.')}if(r===2){p.crit+=.03;say('Relic: +3% critical chance.')}if(r===3){p.armor=Math.min(.5,p.armor+.03);say('Relic: +3% armor.')}}}
 if(!keyItem.taken&&dist(p,keyItem)<.65){keyItem.taken=true;p.key=true;say('The Arcane Key is yours. The Moon Gate awakens.');burst(keyItem.x,keyItem.y,[255,215,75],45)}
 if(dist(p,gate)<.8&&p.key&&enemies.every(e=>e.dead))victory();
 fx.forEach(q=>{q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=dt*1.5});fx=fx.filter(q=>q.life>0);updateHUD();}
function cast(){if(!running)return;let i=p.sel,n=p.spells[i],s=spell[n];if(p.cd[i]>0||p.mp<s.cost)return;p.mp-=s.cost;p.cd[i]=s.cd;castFlash=1;shake=.25;
 if(s.type==='bolt')shots.push({x:p.x+Math.cos(p.a)*.3,y:p.y+Math.sin(p.a)*.3,a:p.a,speed:s.speed,dmg:s.dmg,color:s.color,life:2.2});
 if(s.type==='nova'){for(let e of enemies)if(!e.dead&&dist(p,e)<3.2){damageEnemy(e,s.dmg);e.slow=2.5}burst(p.x,p.y,s.color,45)}
 if(s.type==='ward'){p.ward=5;say('Arcane ward raised.');burst(p.x,p.y,s.color,28)}
 if(s.type==='blink'){let nx=p.x+Math.cos(p.a)*3.6,ny=p.y+Math.sin(p.a)*3.6;if(!solid(nx,ny)){burst(p.x,p.y,s.color,30);p.x=nx;p.y=ny;burst(p.x,p.y,s.color,30)}}
 if(s.type==='chain'){let ts=enemies.filter(e=>!e.dead&&dist(p,e)<6).sort((a,b)=>dist(p,a)-dist(p,b)).slice(0,4);ts.forEach((e,k)=>{damageEnemy(e,s.dmg*(1-k*.16));burst(e.x,e.y,s.color,15)})}
 if(s.type==='meteor'){let tx=p.x+Math.cos(p.a)*4,ty=p.y+Math.sin(p.a)*4;for(let e of enemies)if(!e.dead&&Math.hypot(e.x-tx,e.y-ty)<2.7)damageEnemy(e,s.dmg);burst(tx,ty,s.color,70);shake=1}
 if(s.type==='quake'){for(let e of enemies)if(!e.dead&&dist(p,e)<4.5){damageEnemy(e,s.dmg);e.slow=3}burst(p.x,p.y,s.color,65);shake=1}
 if(s.type==='drain'){let e=aimed(5);if(e){damageEnemy(e,s.dmg);p.hp=Math.min(p.maxHp,p.hp+s.dmg*.55);burst(e.x,e.y,s.color,30)}}
 if(s.type==='vanish'){p.vanish=4;say('You fade from sight.');burst(p.x,p.y,s.color,30)}}
function aimed(range){let best=null,score=.2;for(let e of enemies){if(e.dead)continue;let d=dist(p,e),a=Math.abs(adiff(Math.atan2(e.y-p.y,e.x-p.x),p.a));if(d<range&&a<score){score=a;best=e}}return best}
function damageEnemy(e,d){let crit=rnd()<p.crit;if(crit)d*=1.8;e.hp-=d;e.hit=.18;burst(e.x,e.y,crit?[255,220,80]:[220,60,60],crit?18:8);if(e.hp<=0&&!e.dead){e.dead=true;p.kills++;p.gold+=ri(3,11);gainXP(e.type==='ogre'?50:28);if(rnd()<.22)drops.push({x:e.x,y:e.y,kind:rnd()<.55?'health':'mana',taken:false})}}
function gainXP(v){p.xp+=v;while(p.xp>=p.next){p.xp-=p.next;p.level++;p.next=Math.floor(p.next*1.35);p.maxHp+=12;p.hp=p.maxHp;p.maxMp+=10;p.mp=p.maxMp;p.crit+=.012;say('LEVEL UP — your power is restored.')}}
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=rnd(Math.PI*2),v=rnd(2.5,.3);fx.push({x,y,z:rnd(1.4,.05),vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:rnd(2,.2),life:rnd(.9,.25),color})}}
function trail(x,y,color){if(rnd()<.65)fx.push({x,y,z:rnd(1.2,.5),vx:rnd(.4,-.4),vy:rnd(.4,-.4),vz:rnd(.5,-.1),life:rnd(.35,.12),color})}
function say(t){document.querySelector('#message').textContent=t;msgT=2.6}
function die(){running=false;document.exitPointerLock?.();document.querySelector('#deadText').textContent=`Level ${p.level} ${p.cls} · ${p.kills} foes defeated · ${p.gold} gold recovered`;document.querySelector('#dead').style.display='flex'}
function victory(){running=false;document.exitPointerLock?.();document.querySelector('#winText').textContent=`Level ${p.level} ${p.cls} · ${p.kills} foes defeated · ${p.gold} gold · realm seed ${seed>>>0}`;document.querySelector('#win').style.display='flex'}
function wallColor(type,u,d,wx,wy){let mortar=(Math.floor(u*8)%4===0)||((Math.floor((H/(d+.1))*u)+wy)%19===0),v=Math.max(.13,1-d/14),warm=lightAt(wx,wy);let base=type===2?[56,47,42]:[48,56,65];if(mortar)base=[25,29,35];return base.map(c=>Math.min(255,c*v+warm)).join(',')}
function lightAt(x,y){let L=0;for(let t of torches){let d=Math.hypot(x-t.x,y-t.y);if(d<5)L+=Math.max(0,65-d*13)}return Math.min(90,L)}
function raycast(){let bob=Math.sin(p.bob)*2,shx=(rnd()-.5)*shake*5,shy=(rnd()-.5)*shake*4;X.fillStyle='#05040b';X.fillRect(0,0,W,H);let sky=X.createLinearGradient(0,0,0,H/2);sky.addColorStop(0,'#070518');sky.addColorStop(1,'#151c2c');X.fillStyle=sky;X.fillRect(0,0,W,H/2+bob+shy);let floor=X.createLinearGradient(0,H/2,0,H);floor.addColorStop(0,'#14171b');floor.addColorStop(1,'#050609');X.fillStyle=floor;X.fillRect(0,H/2+bob+shy,W,H/2);
 for(let x=0;x<W;x++){let ra=p.a-FOV/2+FOV*x/W,rx=Math.cos(ra),ry=Math.sin(ra),d=0,step=.018;while(d<22&&!solid(p.x+rx*d,p.y+ry*d))d+=step;let cd=d*Math.cos(ra-p.a);depth[x]=cd;let wx=p.x+rx*d,wy=p.y+ry*d,fx=wx-Math.floor(wx),fy=wy-Math.floor(wy),u=(fx<.03||fx>.97)?fy:fx,hh=Math.min(H*1.8,H/(cd+.001)),yt=(H-hh)/2+bob+shy;let typ=((wx|0)+(wy|0))%5===0?2:1;X.fillStyle=`rgb(${wallColor(typ,u,cd,wx,wy)})`;X.fillRect(x+shx,yt,1,hh);if(cd<8&&Math.floor(u*16)%8===0){X.fillStyle=`rgba(255,255,255,${.035*(1-cd/8)})`;X.fillRect(x+shx,yt,1,hh)}}
 drawSprites(bob+shy,shx);drawWeapon(bob,shx,shy);if(hitFlash){X.fillStyle=`rgba(190,0,20,${hitFlash*.28})`;X.fillRect(0,0,W,H)}if(p.ward){X.strokeStyle=`rgba(100,255,160,${.15+.08*Math.sin(performance.now()/90)})`;X.lineWidth=8;X.strokeRect(4,4,W-8,H-8)}if(showMap)drawMini();}
function sprite(kind,x,y,size,extra={}){zSprite.push({kind,x,y,size,...extra,d:Math.hypot(x-p.x,y-p.y)})}
function drawSprites(bob,shx){zSprite=[];for(let t of torches)sprite('torch',t.x,t.y,.7,{phase:t.phase});for(let e of enemies)if(!e.dead)sprite(e.type,e.x,e.y,e.type==='ogre'?1.4:.9,{e});for(let d of drops)if(!d.taken)sprite(d.kind,d.x,d.y,.45);if(!keyItem.taken)sprite('key',keyItem.x,keyItem.y,.55);sprite('gate',gate.x,gate.y,1.25);for(let q of shots)sprite('magic',q.x,q.y,.3,{color:q.color});for(let q of fx)sprite('particle',q.x,q.y,.08,{color:q.color,z:q.z,life:q.life});zSprite.sort((a,b)=>b.d-a.d);
 for(let s of zSprite){let ang=adiff(Math.atan2(s.y-p.y,s.x-p.x),p.a);if(Math.abs(ang)>FOV*.72||s.d<.08)continue;let sx=(.5+ang/FOV)*W+shx,sz=Math.min(H*2,H/s.d*s.size),sy=H/2-sz/2+bob-(s.z||0)*sz*.5;if(s.kind==='particle'||s.kind==='magic'){let c=s.color||[255,255,255];X.fillStyle=`rgba(${c.join(',')},${Math.min(1,s.life||1)})`;for(let yy=0;yy<sz;yy++)for(let xx=0;xx<sz;xx++)if((xx-sz/2)**2+(yy-sz/2)**2<sz*sz/4){let px=(sx-sz/2+xx)|0;if(px>=0&&px<W&&s.d<depth[px])X.fillRect(px,(sy+yy)|0,1,1)}continue}drawPixelSprite(s,sx,sy,sz);}}
function drawPixelSprite(s,sx,sy,sz){let e=s.e,cols={goblin:['#20381e','#4f8a3f','#d34632','#6b4d27'],skeleton:['#c8c2a8','#786f60','#a61d2f','#302c28'],wraith:['#574178','#9b68cf','#e6d7ff','#1f1830'],ogre:['#554137','#8a6c4e','#d05932','#2d251f'],torch:['#51321b','#ff8b20','#ffd75a','#fff1b0'],health:['#a51b37','#fa4b6e','#f4d6ce','#54202b'],mana:['#174c91','#45a9ff','#d4efff','#16284f'],chest:['#4a2d16','#a46a24','#e6bc59','#241408'],key:['#795d16','#f0c84b','#fff0a3','#3a2d0e'],gate:['#1c3c3d','#38c6aa','#b5ffe5','#172524']}[s.kind];let pat;
 if(['goblin','skeleton','wraith','ogre'].includes(s.kind))pat=["..1111..",".122221.",".123321.","..1221..",".111111.","11211211","1.1111.1","..1..1.."];
 else if(s.kind==='torch')pat=["...2....","..232...","...2....","...1....","...1....","...0....","...0....","........"];
 else if(s.kind==='gate')pat=[".111111.","11222211","12233221","12333321","12333321","12233221","11222211",".111111."];
 else if(s.kind==='key')pat=["...33...","..3223..","..3223..","...33...","...1....","...111..","...1.1..","........"];
 else pat=["........","..1111..",".122221.",".123321.",".122221.","..1111..","........","........"];
 let ps=sz/8,x0=sx-sz/2;for(let yy=0;yy<8;yy++)for(let xx=0;xx<8;xx++){let c=pat[yy][xx];if(c==='.')continue;let px=(x0+xx*ps)|0;if(px<0||px>=W||s.d>=depth[px])continue;X.fillStyle=(e&&e.hit>0)?'#fff':cols[+c];X.fillRect(px,(sy+yy*ps)|0,Math.ceil(ps),Math.ceil(ps))}
 if(e&&s.d<7){let w=sz*.75;X.fillStyle='#0b0909';X.fillRect(sx-w/2,sy-5,w,3);X.fillStyle='#c93649';X.fillRect(sx-w/2,sy-5,w*Math.max(0,e.hp/e.maxHp),3)}}
function drawWeapon(bob,shx,shy){let t=performance.now()/1000,cast=castFlash,ox=W*.69+shx+Math.sin(p.bob*.5)*2,oy=H*.75+shy+Math.abs(Math.sin(p.bob))*2-cast*8;X.save();X.translate(ox,oy);X.rotate(-.28+cast*.12);X.fillStyle='#2a211c';X.fillRect(0,0,60,55);X.fillStyle='#4c3b2d';X.fillRect(5,5,50,40);X.fillStyle='#171313';for(let i=0;i<4;i++)X.fillRect(7+i*11,-8,9,30);let s=spell[p.spells[p.sel]],c=s?s.color:[255,120,30],r=12+cast*8+Math.sin(t*6)*2,g=X.createRadialGradient(-2,-14,1,-2,-14,r);g.addColorStop(0,'#fff');g.addColorStop(.2,`rgb(${c.join(',')})`);g.addColorStop(1,`rgba(${c.join(',')},0)`);X.fillStyle=g;X.fillRect(-r-2,-r-14,r*2,r*2);X.restore()}
function drawMini(){MX.clearRect(0,0,MM.width,MM.height);MX.fillStyle='#020508';MX.fillRect(0,0,MM.width,MM.height);let sc=Math.min(5,Math.min(MM.width/MW,MM.height/MH)),ox=(MM.width-MW*sc)/2,oy=(MM.height-MH*sc)/2;for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){MX.fillStyle=map[y][x]?'#07090d':'#1f2933';MX.fillRect(ox+x*sc,oy+y*sc,sc,sc)}MX.fillStyle=p.key?'#66e0ba':'#e8c34f';MX.fillRect(ox+gate.x*sc-2,oy+gate.y*sc-2,5,5);if(!keyItem.taken){MX.fillStyle='#e8c34f';MX.fillRect(ox+keyItem.x*sc-2,oy+keyItem.y*sc-2,4,4)}MX.fillStyle='#ffcf4f';MX.beginPath();MX.moveTo(ox+p.x*sc+Math.cos(p.a)*7,oy+p.y*sc+Math.sin(p.a)*7);MX.lineTo(ox+p.x*sc+Math.cos(p.a+2.5)*5,oy+p.y*sc+Math.sin(p.a+2.5)*5);MX.lineTo(ox+p.x*sc+Math.cos(p.a-2.5)*5,oy+p.y*sc+Math.sin(p.a-2.5)*5);MX.fill()}
function updateHUD(){document.querySelector('#name').textContent=`${p.cls} · Level ${p.level}`;document.querySelector('#hpText').textContent=`HP ${Math.max(0,Math.ceil(p.hp))}/${p.maxHp}`;document.querySelector('#mpText').textContent=`MANA ${Math.ceil(p.mp)}/${p.maxMp}`;document.querySelector('#xpText').textContent=`XP ${p.xp}/${p.next}`;document.querySelector('#hpFill').style.width=100*p.hp/p.maxHp+'%';document.querySelector('#mpFill').style.width=100*p.mp/p.maxMp+'%';document.querySelector('#xpFill').style.width=100*p.xp/p.next+'%';document.querySelector('#statsPanel').innerHTML=`Kills: ${p.kills}<br>Gold: ${p.gold}<br>Armor: ${Math.round(p.armor*100)}%<br>Crit: ${Math.round(p.crit*100)}%`;let alive=enemies.filter(e=>!e.dead).length;document.querySelector('#enemyCount').textContent=alive+' remaining';document.querySelector('#q1').classList.toggle('done',p.key);document.querySelector('#q1').innerHTML=`${p.key?'✓':'◇'} Find the Arcane Key <span style="float:right">${p.key?1:0} / 1</span>`;document.querySelector('#q2').classList.toggle('done',alive===0);document.querySelector('#q3').classList.toggle('done',p.key&&alive===0);p.spells.forEach((n,i)=>{let el=document.querySelector('#slot'+i),s=spell[n];if(el){el.classList.toggle('active',i===p.sel);el.querySelector('small').textContent=p.cd[i]>0?p.cd[i].toFixed(1)+'s':s.cost+' mana'}})}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);raycast();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.code]=true;if(/^Digit[1-4]$/.test(e.code)&&running){p.sel=+e.code.at(-1)-1;buildSpells()}if(e.code==='Space'){e.preventDefault();cast()}if(e.code==='KeyM')showMap=!showMap});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('mousemove',e=>{if(document.pointerLockElement===C&&running)p.a+=e.movementX*.0025});C.addEventListener('mousedown',()=>{if(running){C.requestPointerLock?.();cast()}});
setup();
